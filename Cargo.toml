[package]
name = "audio_player"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# Audio
rodio = "0.17"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "isomp4"] }

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Concurrency / channels
crossbeam-channel = "0.5"